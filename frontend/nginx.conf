server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.github.com ws: wss:; font-src 'self' data:; frame-src https:; worker-src 'self' blob:;" always;

    # nginx's bundled mime.types stops at .js. There is no .mjs entry, so an
    # ES-module asset comes back as application/octet-stream, and the nosniff
    # header above then makes the browser refuse to execute it. pdf.js ships its
    # worker as .mjs, so without this line a PDF opens to an empty frame in the
    # container and nowhere else, which is the worst kind of bug to find.
    # `default_type` rather than a `types` block on purpose: a types block
    # REPLACES the bundled map wholesale, taking every other content type with
    # it, while default_type only fills in where the map said nothing.
    # (.wasm, pdf.js's other outside-the-bundle asset, has been in nginx's own
    # map since 1.21.5 and needs nothing here.)
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://openmemo-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /files/ {
        proxy_pass http://openmemo-api:8000;
    }
}
