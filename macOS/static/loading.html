<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenMemo</title>
    <!-- Black and white on purpose. This screen used to shimmer violet into
         sky blue with a violet glow on the spinner, none of which is an
         openMemo colour or a decision anyone made. When in doubt: greyscale. -->
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: radial-gradient(120% 120% at 50% 0%, #1a1a1a 0%, #0a0a0a 60%);
        color: #ededed;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; gap: 28px; overflow: hidden; -webkit-user-select: none; user-select: none;
        /* NO -webkit-app-region: drag here — on macOS the drag region can
           survive the in-place navigation to the SPA, which then eats every
           click (window-drag instead of click) while keyboard keeps working. */
      }
      .mark {
        font-size: 34px; font-weight: 700; letter-spacing: -0.02em;
        background: linear-gradient(100deg, #8a8a8a 0%, #ffffff 50%, #8a8a8a 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: shimmer 3.2s ease-in-out infinite;
      }
      .mark b { font-weight: 800; }
      @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
      .ring {
        width: 46px; height: 46px; border-radius: 50%;
        border: 2.5px solid rgba(255,255,255,0.14);
        border-top-color: #ffffff; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .status { color: #8f8f8f; font-size: 13px; }
      .log {
        position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
        color: #565656; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px; padding: 0 24px; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; opacity: 0; transition: opacity 0.4s;
      }
      @media (prefers-reduced-motion: reduce) {
        .mark, .ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="mark">open<b>Memo</b></div>
    <div class="ring"></div>
    <div class="status">Starting your local knowledge OS…</div>
    <div class="log" id="log"></div>
    <script>
      const log = document.getElementById('log');
      const status = document.querySelector('.status');
      if (window.openmemoBoot) {
        window.openmemoBoot.onLog((line) => {
          const t = String(line).trim();
          if (!t) return;
          // Lines marked [status] say what the app is doing right now and belong
          // in the headline. Everything else is boot detail for the ticker,
          // which shows one line at a time and scrolls past too fast to read.
          if (t.startsWith('[status]')) {
            status.textContent = t.slice('[status]'.length).trim();
            return;
          }
          log.textContent = t;
          log.style.opacity = '1';
        });
      }
    </script>
  </body>
</html>
