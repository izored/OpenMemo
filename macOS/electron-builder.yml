# electron-builder config — Apple-Silicon .dmg, unsigned (no dev account).
#
# Build on a Mac:  CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist
#   CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder hunting for a real
#   Developer ID cert; it falls back to an ad-hoc signature ("-"), which is the
#   minimum macOS needs to launch an arm64 app. Without a paid Apple account we
#   cannot notarize, so first launch still needs the Gatekeeper workaround
#   (right-click → Open, or `xattr -dr com.apple.quarantine`). See docs/MACOS.md.
appId: studio.izo.openmemo
productName: OpenMemo
copyright: © izo.studio

directories:
  output: release
  # NOT "build" — the repo's root .gitignore ignores build/, which would drop
  # the icon + entitlements from version control.
  buildResources: buildResources

# What goes inside the asar (the shell itself). The Python runtime, backend
# source, built SPA, and ffmpeg are added as extraResources below.
files:
  - dist-electron/**/*
  # Unit tests compile alongside the shell (one tsconfig). They have no business
  # inside the asar, and node:test is not available to the packaged runtime.
  - '!dist-electron/*.test.js'
  - '!dist-electron/*.test.js.map'
  - static/**/*
  - package.json

# Assembled by scripts/bundle-backend.mjs before electron-builder runs. Each
# lands under Contents/Resources/<to> — matching resolvePaths() in src/paths.ts.
extraResources:
  - from: resources-stage/python
    to: python
  - from: resources-stage/app-backend
    to: app-backend
  - from: resources-stage/frontend-dist
    to: frontend-dist
  - from: resources-stage/ffmpeg
    to: ffmpeg

npmRebuild: false

# Guarantee a valid (ad-hoc) signature on every mach-o even when builder skips
# signing (no Developer ID). See scripts/afterPack.cjs.
afterPack: scripts/afterPack.cjs

# openmemo:// deep links (CFBundleURLTypes) — handled in src/main.ts open-url.
protocols:
  - name: OpenMemo
    schemes:
      - openmemo

mac:
  category: public.app-category.productivity
  icon: buildResources/icon.png   # electron-builder generates the .icns from this 1024px PNG
  extendInfo:
    NSHumanReadableCopyright: "© izo.studio"
    CFBundleDisplayName: OpenMemo
    LSMinimumSystemVersion: "12.0"
  target:
    - target: dmg
      arch:
        - arm64
  # No paid account → don't harden (entitlements would be enforced) and don't
  # let Gatekeeper assessment fail the build. Ad-hoc signing happens via the
  # CSC_IDENTITY_AUTO_DISCOVERY=false env at build time.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: buildResources/entitlements.mac.plist
  entitlementsInherit: buildResources/entitlements.mac.plist

# The .dmg is the whole onboarding surface for an un-notarised app: the window
# has to say what to do AND warn that the first launch gets blocked, because the
# macOS 15+ block dialog is a dead end (only "Done" and "Move to Bin") and users
# who do not know that bin the app. Hence a designed background and a leaflet
# next to the icons.
#
# background.png / background@2x.png are picked up by name from buildResources.
# Both are generated from buildResources/dmg/background.html by
# `node buildResources/dmg/render.mjs`; edit the HTML, never the PNGs. Icon
# coordinates below and the empty zones in that HTML are one layout — move one,
# move the other.
dmg:
  title: OpenMemo
  window:
    width: 620
    height: 480
  contents:
    # The app.
    - x: 170
      y: 215
      type: file
    - x: 450
      y: 215
      type: link
      path: /Applications
    # The first-launch leaflet, bottom left, clear of the drag path above it.
    - x: 140
      y: 385
      type: file
      # Resolved against buildResources first (see getResource in
      # app-builder-lib), and a miss is a hard build error, not a silent skip.
      path: Read Me First.pdf
