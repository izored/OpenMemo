services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - openmemo-api
      - openmemo-web
    restart: unless-stopped

  openmemo-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./files:/app/files
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - 'OLLAMA_HOSTS=["http://host.docker.internal:11434", "http://ollama_gpu0:11434", "http://ollama_gpu1:11435"]'
      - DATABASE_URL=sqlite+aiosqlite:///./data/openmemo.db
      - CHROMA_PERSIST_DIR=./data/chroma
      - FILES_DIR=./files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  openmemo-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      openmemo-api:
        condition: service_healthy
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
