services:
  nginx:
    image: nginx:alpine
    ports:
      - "8091:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - openmemo-api
      - openmemo-web
    restart: unless-stopped

  openmemo-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    ports:
      # Mesh sync. Publishing it is necessary but not sufficient: the listener
      # binds loopback until you turn on Settings -> Mesh -> "Reachable on my
      # network", so with that off this forwards to a socket nothing outside the
      # container can talk to anyway. Both switches have to be on, which is the
      # point — nothing is exposed by installing.
      - "8770:8770"
    volumes:
      - ./data:/app/data
      - ./files:/app/files
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - 'OLLAMA_HOSTS=["http://host.docker.internal:11434", "http://host.docker.internal:11435"]'
      - EMBED_MODEL=nomic-embed-text-v2-moe:latest
      - DEFAULT_CHAT_MODEL=gemma4:e4b
      - DEFAULT_VISION_MODEL=gemma4:e4b
      - DATABASE_URL=sqlite+aiosqlite:///./data/openmemo.db
      - CHROMA_PERSIST_DIR=./data/chroma
      - FILES_DIR=./files
      # Persist the faster-whisper STT model under the mounted ./data volume so
      # it downloads once, not on every container recreate.
      - HF_HOME=/app/data/hf-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Liveness only — hits /api/ping (no Ollama). Hitting /api/health here would
      # tie container health to the LLM being up and probe Ollama every 10s.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  openmemo-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      openmemo-api:
        condition: service_healthy
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
