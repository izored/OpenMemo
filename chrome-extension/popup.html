<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #1F2937;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid #E5E7EB;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #D97706;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
    }
    .title { font-size: 14px; font-weight: 600; }
    .status {
      margin-left: auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status.connected { background: #10B981; }
    .status.disconnected { background: #EF4444; }
    .content { padding: 16px; }
    .preview {
      background: #F9FAFB;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .preview-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .preview-url {
      font-size: 11px;
      color: #6B7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .save-btn {
      width: 100%;
      padding: 10px;
      background: #D97706;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .save-btn:hover { background: #B45309; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .save-btn.success { background: #10B981; }
    .message {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">O</div>
    <span class="title">OpenMemo</span>
    <div class="status" id="status"></div>
  </div>
  <div class="content">
    <div class="preview">
      <div class="preview-title" id="pageTitle">Loading...</div>
      <div class="preview-url" id="pageUrl"></div>
    </div>
    <button class="save-btn" id="saveBtn">Save to OpenMemo</button>
    <div class="message" id="message"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
