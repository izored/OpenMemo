<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: #F5F2EC;
      -webkit-font-smoothing: antialiased;
    }
    .popup-root {
      background: #0C0C0E;
      border-radius: 14px;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #F4825A;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    .title { font-size: 13.5px; font-weight: 600; color: #F5F2EC; letter-spacing: -0.01em; }
    .status {
      margin-left: auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
    }
    .status.connected { background: #4ade80; }
    .status.disconnected { background: #f87171; }
    .content { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .preview {
      background: #131316;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .preview-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      color: #F5F2EC;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .preview-url {
      font-size: 11px;
      color: rgba(245,242,236,0.38);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, monospace;
    }
    .save-btn {
      width: 100%;
      padding: 10px;
      background: #F4825A;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: -0.01em;
    }
    .save-btn:hover { opacity: 0.88; }
    .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .save-btn.success { background: #4ade80; color: #0C0C0E; }
    .message {
      text-align: center;
      font-size: 11.5px;
      color: rgba(245,242,236,0.38);
      min-height: 16px;
    }
  </style>
</head>
<body>
<div class="popup-root">
  <div class="header">
    <div class="logo">O</div>
    <span class="title">OpenMemo</span>
    <div class="status" id="status"></div>
  </div>
  <div class="content">
    <div class="preview">
      <div class="preview-title" id="pageTitle">Loading...</div>
      <div class="preview-url" id="pageUrl"></div>
    </div>
    <button class="save-btn" id="saveBtn">Save to OpenMemo</button>
    <div class="message" id="message"></div>
  </div>
  <script src="popup.js"></script>
</div>
</body>
</html>
