<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #1F2937;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #E5E7EB;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #D97706;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 10px;
    }
    .title { font-size: 13px; font-weight: 600; }
    .summary {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .summary h2 { font-size: 14px; margin-bottom: 8px; }
    .summary p { font-size: 12px; line-height: 1.5; color: #374151; }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6B7280;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">O</div>
    <span class="title">OpenMemo Summary</span>
  </div>
  <div class="summary" id="content">
    <div class="loading">Generating summary...</div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
