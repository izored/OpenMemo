<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0C0C0E;
      color: #F5F2EC;
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #F4825A;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
    }
    .title { font-size: 13px; font-weight: 600; color: #F5F2EC; letter-spacing: -0.01em; }
    .summary {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .summary h2 {
      font-size: 14px;
      font-weight: 600;
      color: #F5F2EC;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }
    .summary p {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(245,242,236,0.65);
      margin-bottom: 8px;
    }
    .summary ul, .summary ol {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(245,242,236,0.65);
      padding-left: 18px;
      margin-bottom: 8px;
    }
    .summary strong { color: #F5F2EC; font-weight: 600; }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgba(245,242,236,0.32);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">O</div>
    <span class="title">OpenMemo Summary</span>
  </div>
  <div class="summary" id="content">
    <div class="loading">Generating summary...</div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
