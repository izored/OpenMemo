name: Build macOS app (.dmg)

# Builds the Apple-Silicon .dmg in the cloud. Manual (workflow_dispatch) or on a
# version tag push. The macos-14 runner IS arm64, which bundle-backend.mjs
# requires (it downloads an arm64 Python + native wheels + arm64 ffmpeg).
#
# Unsigned / ad-hoc only (no paid Apple account → CSC_IDENTITY_AUTO_DISCOVERY=false),
# so the artifact still needs the Gatekeeper step on first launch — see docs/MACOS.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN is read-only for releases; "Attach .dmg to release"
# needs write (v3.0.0 run failed with HTTP 403 without this).
permissions:
  contents: write
  actions: write   # needed to delete old artifacts in the cleanup step below

jobs:
  build:
    runs-on: macos-14            # Apple Silicon (arm64)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Install macOS shell deps
        run: npm --prefix macOS install

      - name: Build .dmg
        working-directory: macOS
        env:
          # Don't hunt for a Developer ID cert; afterPack.cjs ad-hoc signs.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Authenticated GitHub API calls in bundle-backend.mjs (rate limits).
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist

      # Tag builds: attach the .dmg to the release for that tag FIRST — the
      # release is the deliverable, and it must never wait behind the
      # quota-prone artifact upload (v3.1.0's first build died on "Artifact
      # storage quota has been hit" before this step ever ran). Upload only —
      # release creation (with its full-changelog body) stays with the
      # documented release flow. Non-fatal if the release doesn't exist yet;
      # a 403 (token can't write releases) is a real failure, not a warning.
      - name: Attach .dmg to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if output=$(gh release upload "${GITHUB_REF_NAME}" macOS/release/*.dmg --clobber 2>&1); then
            echo "Attached .dmg to release ${GITHUB_REF_NAME}."
          else
            echo "$output"
            if echo "$output" | grep -qi "403\|Resource not accessible"; then
              echo "::error::Token can't write releases (HTTP 403). Keep 'permissions: contents: write' in this workflow and check the repo's Actions token settings."
              exit 1
            fi
            echo "::warning::No release for ${GITHUB_REF_NAME} yet — create it, then re-run this job or upload the artifact manually."
          fi

      # One .dmg on the releases page, not ten. Each is ~400MB, and by v3.8.0
      # there were nine older ones sitting there for ~3.7GB of nothing: nobody
      # installs an old build of a local-first app they can rebuild from a tag.
      #
      # Runs AFTER the upload above and never before it, so a failed upload
      # cannot leave the page with no .dmg at all. The current tag is excluded
      # explicitly rather than by ordering, because "delete everything then
      # upload" is one crashed runner away from deleting the only copy.
      #
      # Never fatal: the release is already published with its .dmg by this
      # point, and a tidy-up is not worth failing a green build over.
      - name: Delete .dmg from older releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="${GITHUB_REF_NAME}"
          echo "Keeping the .dmg on ${keep}; removing it from every other release."
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$tag" = "$keep" ]; then
              continue
            fi
            assets=$(gh release view "$tag" --json assets --jq '.assets[] | select(.name | endswith(".dmg")) | .name' 2>/dev/null || true)
            for asset in $assets; do
              if gh release delete-asset "$tag" "$asset" --yes 2>/dev/null; then
                echo "  deleted ${tag}/${asset}"
              else
                echo "::warning::could not delete ${tag}/${asset}"
              fi
            done
          done

      # Actions storage is capped (0.5GB free tier); each .dmg is ~400MB, so
      # more than one live copy blows the quota. Delete prior runs' artifacts
      # of the same name before uploading this run's.
      - name: Delete old .dmg artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="OpenMemo-macos-arm64") | .id')
          for id in $ids; do
            echo "Deleting old artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      # Best-effort CI copy: the account-wide storage quota can block this even
      # with zero artifacts in THIS repo, and the .dmg is already on the
      # release by now — never fail the build over it.
      - name: Upload .dmg
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: OpenMemo-macos-arm64
          path: macOS/release/*.dmg
          if-no-files-found: error
