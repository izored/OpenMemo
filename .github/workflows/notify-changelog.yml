name: Notify izored Changelog

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to izored/izored
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CHANGELOG_TOKEN }}
          script: |
            const release = context.payload.release;
            const repoName = context.repo.repo;
            const owner = context.repo.owner;
            const version = release ? release.tag_name : 'v1.7.43';
            // repository_dispatch caps client_payload around 64KB — v3.0.0's
            // 108KB milestone body was rejected outright ("client_payload is
            // too large") and the profile entry silently never happened.
            // Truncate at a line boundary under a safe budget and point to the
            // release page for the rest; the GitHub Release itself always
            // carries the full body (its limit is 125K chars).
            const MAX_DESC = 55000;
            let description = release?.body ? release.body.trim() : `${version} released`;
            if (description.length > MAX_DESC) {
              const cut = description.lastIndexOf('\n', MAX_DESC);
              description = description.slice(0, cut > 0 ? cut : MAX_DESC)
                + `\n\n… truncated — full notes: https://github.com/${owner}/${repoName}/releases/tag/${version}`;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'izored',
              repo: 'izored',
              event_type: 'release-published',
              client_payload: {
                repo: repoName,
                version,
                title: release ? (release.name || version) : version,
                description,
                date: release ? release.published_at.split('T')[0] : new Date().toISOString().split('T')[0],
                type: 'launch',
                emoji: '🚀',
                projectUrl: `https://github.com/${owner}/${repoName}`,
                releaseUrl: `https://github.com/${owner}/${repoName}/releases/tag/${version}`,
              },
            });
