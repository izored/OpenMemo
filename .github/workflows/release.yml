name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
      name: ${{ steps.notes.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Refuse to publish a release whose code does not agree with the tag.
      # A tag is public and permanent the moment it lands, so the cheap checks
      # belong BEFORE the release is created, not after someone notices the
      # footer says a different number than the download they just grabbed.
      - name: Verify the tag matches what the code claims
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          fail=0

          check() {  # name, actual
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 says '$2' but the tag says '$VERSION'"
              fail=1
            else
              echo "ok: $1 = $VERSION"
            fi
          }

          check "backend/config.py" \
            "$(sed -n 's/.*VERSION: str = "\([0-9.]*\)".*/\1/p' backend/config.py | head -n1)"
          check "chrome-extension/manifest.json" \
            "$(jq -r .version chrome-extension/manifest.json)"
          check "macOS/package.json" \
            "$(jq -r .version macOS/package.json)"
          check "macOS/package-lock.json" \
            "$(jq -r .version macOS/package-lock.json)"
          check "README badge" \
            "$(grep -o 'version-[0-9]\+\.[0-9]\+\.[0-9]\+' README.md | head -n1 | cut -d- -f2)"

          if ! grep -q "^## \[${VERSION}\]" docs/CHANGELOG.md; then
            echo "::error::docs/CHANGELOG.md has no '## [${VERSION}]' section"
            fail=1
          else
            echo "ok: changelog has a [${VERSION}] section"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Refusing to publish ${GITHUB_REF_NAME}. Delete the tag, fix the mismatch, and tag again."
            exit 1
          fi

      # Use the hand-written section from docs/CHANGELOG.md as the release body,
      # verbatim. The release body must carry the FULL formatted changelog for
      # the tagged version (no auto-summarised git-cliff notes) — it is what
      # GitHub shows AND what gets dispatched to the izored/izored profile repo
      # by notify-changelog.yml. The tag (e.g. v2.0.0) maps to the [2.0.0]
      # heading in the changelog.
      - name: Extract changelog section for this tag
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG="docs/CHANGELOG.md"
          echo "Extracting [$VERSION] from $CHANGELOG"
          # Pull everything from "## [VERSION]" up to (but not including) the
          # next "## [" heading.
          section="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; print; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' "$CHANGELOG")"
          if [ -z "$section" ]; then
            echo "::error::No changelog section found for [$VERSION] in $CHANGELOG"
            exit 1
          fi
          {
            echo "body<<__RELEASE_EOF__"
            echo "$section"
            echo "__RELEASE_EOF__"
          } >> "$GITHUB_OUTPUT"
          # Name the release from the annotated tag's message (bump-version.ps1
          # -Title). Read it via the API, not local git: actions/checkout peels
          # the tag to its commit, so `git for-each-ref … %(contents:subject)`
          # returns the release COMMIT subject ("release: vX.Y.Z"), not the tag.
          # The API returns the true annotation and never fails the job.
          name="openMemo ${GITHUB_REF_NAME}"
          title=""
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq 'select(.object.type=="tag") | .object.sha' 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            title="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.message' 2>/dev/null | head -n1 || true)"
          fi
          if [ -n "$title" ] && [ "$title" != "openMemo ${GITHUB_REF_NAME}" ] && [ "$title" != "release: ${VERSION}" ]; then
            name="${name} — ${title}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.notes.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false

  # Announce to the profile repo IN THIS RUN rather than waiting for a
  # `release: published` event. That event does NOT fire for a release created
  # by a workflow using GITHUB_TOKEN — which is exactly how the job above
  # creates it — so notify-changelog.yml sat dormant and v3.2.0, v3.3.0 and
  # v3.4.0 never reached izored/izored. A dependent job has no such problem:
  # same run, ordered, and visible in the same log.
  notify:
    name: Announce to the profile changelog
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to izored/izored
        uses: actions/github-script@v7
        env:
          # Passed through the environment, NEVER interpolated into the script
          # body: the changelog is full of backticks and quotes, which would
          # both break the script and make it injectable.
          RELEASE_BODY: ${{ needs.release.outputs.body }}
          RELEASE_NAME: ${{ needs.release.outputs.name }}
        with:
          github-token: ${{ secrets.CHANGELOG_TOKEN }}
          script: |
            const version = context.ref.replace('refs/tags/', '');
            const owner = context.repo.owner;
            const repoName = context.repo.repo;

            // izored/izored renders this description with its own markdown
            // subset, not GitHub's: "## " section headers, "  • " rows, the
            // leading term backticked, then an em dash before the explanation.
            // Dispatching the raw changelog section sent "###" headings, bold
            // and per-item emoji straight through, so every entry up to and
            // including v3.13.0 rendered in the wrong format. Only this
            // dispatched copy is rewritten; the GitHub release body above
            // stays the verbatim section.
            const toRow = (body) => {
              const text = body.replace(/^[^\p{L}\p{N}`*]+/u, '');
              let term, rest;
              const bold = text.match(/^\*\*(.+?)\*\*\s*([\s\S]*)$/);
              if (bold) {
                term = bold[1];
                rest = bold[2];
              } else {
                const split = text.match(/^(.+?[.:!?])\s+([\s\S]*)$/);
                if (split) { term = split[1]; rest = split[2]; }
                else { term = text; rest = ''; }
              }
              term = term.replace(/\*\*/g, '').replace(/[.:!?]+\s*$/, '').trim();
              // The changelog has had two bullet styles. Current entries end the
              // bold term with a full stop and start straight into the prose;
              // entries up to v2.0.x wrote "**Term** — prose", already carrying
              // the separator this format adds. Without stripping it those rows
              // render "` — — prose".
              rest = rest.replace(/\*\*/g, '').trim()
                .replace(/^[—–]\s*/, '')
                .replace(/^[-:](\s+|$)/, '')
                .trim();
              return rest ? '  • `' + term + '` — ' + rest : '  • `' + term + '`';
            };
            const toProfileFormat = (section) => {
              const out = [];
              for (const raw of section.split('\n')) {
                const line = raw.trim();
                if (!line) { out.push(''); continue; }
                if (/^-{3,}$/.test(line)) continue;
                if (/^#{2,6}\s*\[\d+\.\d+\.\d+\]/.test(line)) continue;
                const heading = line.match(/^#{2,6}\s+(.*)$/);
                if (heading) { out.push('## ' + heading[1].trim()); continue; }
                const bullet = line.match(/^[-*+]\s+(.*)$/);
                if (bullet) { out.push(toRow(bullet[1])); continue; }
                out.push(line.replace(/\*\*/g, ''));
              }
              return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
            };

            // repository_dispatch caps client_payload around 64KB — v3.0.0's
            // 108KB body was rejected outright and the profile entry silently
            // never happened. Truncate at a line boundary and link the rest.
            // Convert first: truncating raw markdown and then converting could
            // cut a bullet in half and leave a dangling term.
            const MAX_DESC = 55000;
            let description = toProfileFormat(process.env.RELEASE_BODY || '')
              || `${version} released`;
            if (description.length > MAX_DESC) {
              const cut = description.lastIndexOf('\n', MAX_DESC);
              description = description.slice(0, cut > 0 ? cut : MAX_DESC)
                + `\n\n… truncated — full notes: https://github.com/${owner}/${repoName}/releases/tag/${version}`;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'izored',
              repo: 'izored',
              event_type: 'release-published',
              client_payload: {
                repo: repoName,
                version,
                title: process.env.RELEASE_NAME || version,
                description,
                date: new Date().toISOString().split('T')[0],
                type: 'launch',
                emoji: '🚀',
                projectUrl: `https://github.com/${owner}/${repoName}`,
                releaseUrl: `https://github.com/${owner}/${repoName}/releases/tag/${version}`,
              },
            });
            core.info(`Announced ${version} to izored/izored`);
