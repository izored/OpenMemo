name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use the hand-written section from docs/CHANGELOG.md as the release body,
      # verbatim. The release body must carry the FULL formatted changelog for
      # the tagged version (no auto-summarised git-cliff notes) — it is what
      # GitHub shows AND what gets dispatched to the izored/izored profile repo
      # by notify-changelog.yml. The tag (e.g. v2.0.0) maps to the [2.0.0]
      # heading in the changelog.
      - name: Extract changelog section for this tag
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG="docs/CHANGELOG.md"
          echo "Extracting [$VERSION] from $CHANGELOG"
          # Pull everything from "## [VERSION]" up to (but not including) the
          # next "## [" heading.
          section="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; print; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' "$CHANGELOG")"
          if [ -z "$section" ]; then
            echo "::error::No changelog section found for [$VERSION] in $CHANGELOG"
            exit 1
          fi
          {
            echo "body<<__RELEASE_EOF__"
            echo "$section"
            echo "__RELEASE_EOF__"
          } >> "$GITHUB_OUTPUT"
          # Name the release from the annotated tag's message (bump-version.ps1
          # -Title). Read it via the API, not local git: actions/checkout peels
          # the tag to its commit, so `git for-each-ref … %(contents:subject)`
          # returns the release COMMIT subject ("release: vX.Y.Z"), not the tag.
          # The API returns the true annotation and never fails the job.
          name="openMemo ${GITHUB_REF_NAME}"
          title=""
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq 'select(.object.type=="tag") | .object.sha' 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            title="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.message' 2>/dev/null | head -n1 || true)"
          fi
          if [ -n "$title" ] && [ "$title" != "openMemo ${GITHUB_REF_NAME}" ] && [ "$title" != "release: ${VERSION}" ]; then
            name="${name} — ${title}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.notes.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
