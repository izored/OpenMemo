<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenMemo — Architecture Map</title>
<style>
  :root{
    --bg:#0F0F0F; --panel:#161616; --panel-2:#1c1c1c; --border:#2a2a2a;
    --text:#e8e8e8; --muted:#8a8a8a;
    --client:#4ea1ff; --route:#7bd389; --service:#c792ea; --db:#ffb86b;
    --external:#ff6b9d; --critical:#ff3860; --accent:#f5b942; --accent-2:#ff7a45;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden}
  #app{display:flex;height:100vh;width:100vw}
  /* ---- canvas ---- */
  #stage{position:relative;flex:1;overflow:hidden;cursor:grab}
  #stage.grabbing{cursor:grabbing}
  svg{width:100%;height:100%;display:block}
  .clusterBox{fill-opacity:.18;stroke-width:1.2;rx:14}
  .clusterLabel{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
  .node{cursor:pointer}
  .node rect{fill:var(--panel-2);stroke-width:1.6;rx:9;transition:opacity .15s}
  .node .nlabel{font-size:12.5px;font-weight:650;fill:var(--text)}
  .node .nsub{font-size:10px;fill:var(--muted)}
  .node.dimmed{opacity:.13}
  .node.crit rect{stroke-width:2.4}
  .edge{fill:none;stroke-width:1.4;opacity:.5;transition:opacity .15s}
  .edge.dimmed{opacity:.05}
  .edgeLabel{font-size:9.5px;fill:var(--muted);opacity:.85}
  .edgeLabel.dimmed{opacity:.05}
  .badge-fix{fill:#2ecc71}
  .badge-bug{fill:var(--critical)}
  .badge-txt{font-size:9px;font-weight:700;fill:#0b0b0b}
  /* ---- top bar ---- */
  #topbar{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;flex-wrap:wrap;
    align-items:center;padding:10px 14px;background:linear-gradient(180deg,rgba(15,15,15,.96),rgba(15,15,15,.6));
    z-index:5;pointer-events:none}
  #topbar .chip,#topbar .brand,#zoomctl button{pointer-events:auto}
  .brand{font-weight:800;font-size:14px;margin-right:8px;color:var(--text)}
  .brand small{color:var(--muted);font-weight:500;margin-left:6px}
  .chip{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);
    background:var(--panel);color:var(--muted);cursor:pointer;transition:all .12s;user-select:none}
  .chip:hover{color:var(--text);border-color:#3a3a3a}
  .chip.active{background:var(--accent);color:#101010;border-color:var(--accent);font-weight:700}
  .chip.roadmap.active{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
  #zoomctl{position:absolute;bottom:16px;left:16px;display:flex;gap:6px;z-index:5}
  #zoomctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:16px;cursor:pointer}
  #zoomctl button:hover{border-color:#3a3a3a;background:var(--panel-2)}
  #zoomctl .lbl{width:auto;padding:0 12px;font-size:12px}
  /* ---- sidebar ---- */
  #side{width:380px;min-width:380px;background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;padding:22px 22px 60px}
  #side h2{font-size:15px;margin:0 0 3px}
  #side .path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    color:var(--accent);word-break:break-all;margin-bottom:14px}
  #side .kind{display:inline-block;font-size:10px;padding:2px 8px;border-radius:6px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--muted);margin-bottom:10px}
  #side .sec{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:18px 0 7px}
  #side p.role{font-size:13px;line-height:1.5;margin:6px 0}
  #side p.plain{font-size:12.5px;line-height:1.55;color:#cfcfcf;background:var(--panel-2);
    border-left:3px solid var(--client);padding:10px 12px;border-radius:0 8px 8px 0;margin:8px 0}
  #side ul{margin:6px 0;padding-left:17px}
  #side li{font-size:12px;line-height:1.5;color:#cdcdcd;margin:3px 0}
  #side .edgerow{font-size:11.5px;color:#bdbdbd;padding:4px 0;border-bottom:1px solid #202020}
  #side .edgerow b{color:var(--text)}
  #side .arrow{color:var(--accent);font-weight:700}
  .fix{font-size:12px;line-height:1.45;background:rgba(46,204,113,.08);border-left:3px solid #2ecc71;
    padding:7px 10px;border-radius:0 6px 6px 0;margin:5px 0;color:#d4f5e2}
  .bug{font-size:12px;line-height:1.45;border-left:3px solid var(--critical);padding:7px 10px;
    border-radius:0 6px 6px 0;margin:5px 0;color:#ffd6de;background:rgba(255,56,96,.07)}
  .bug .sev{font-weight:700;text-transform:uppercase;font-size:9.5px;margin-right:6px;
    padding:1px 6px;border-radius:5px;background:var(--critical);color:#fff}
  .bug .ref{font-family:ui-monospace,monospace;font-size:10px;color:var(--accent);display:block;margin-top:3px}
  .find{font-size:12.5px;line-height:1.5;margin:10px 0;padding-left:20px;position:relative;color:#d2d2d2}
  .find:before{content:"▸";position:absolute;left:2px;color:var(--accent)}
  .find b{color:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .legend span{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
  .hint{font-size:11px;color:var(--muted);margin-top:18px;line-height:1.5;border-top:1px solid var(--border);padding-top:14px}
</style>
</head>

  </div>
  <aside id="side"></aside>
</div>

// layers
const gEdges=mk('g'), gEdgeLabels=mk('g'), gNodes=mk('g'), gClusters=mk('g');
const root=mk('g'); root.appendChild(gClusters); root.appendChild(gEdges); root.appendChild(gEdgeLabels); root.appendChild(gNodes);
svg.appendChild(defsArrow()); svg.appendChild(root);

function mk(t){return document.createElementNS(SVGNS,t);}
function attr(el,o){for(const k in o)el.setAttribute(k,o[k]);return el;}

function defsArrow(){
  const defs=mk('defs');
  const kinds={critical:'#ff3860',api:'#ff7a45',db:'#ffb86b',mount:'#4ea1ff',normal:'#5a5a5a'};
  for(const k in kinds){
    const m=attr(mk('marker'),{id:'arr-'+k,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});
    const p=attr(mk('path'),{d:'M0,0 L10,5 L0,10 z',fill:kinds[k]});
    m.appendChild(p); defs.appendChild(m);
  }
  return defs;
}

function visibleByFilter(tags){
  if(activeFilter==='all'||activeFilter==='roadmap')return true;
  return tags && tags.includes(activeFilter);
}
function nodeHasBadges(id){return (FIXES[id]&&FIXES[id].length)||(KNOWN_BUGS[id]&&KNOWN_BUGS[id].length);}

function draw(){
  gClusters.innerHTML='';gEdges.innerHTML='';gEdgeLabels.innerHTML='';gNodes.innerHTML='';

  // clusters
  clusters.forEach(c=>{
    const col=COLORS[c.color];
    const r=attr(mk('rect'),{x:c.x,y:c.y,width:c.w,height:c.h,rx:14,class:'clusterBox',fill:col,stroke:col});
    gClusters.appendChild(r);
    const t=attr(mk('text'),{x:c.x+16,y:c.y+26,class:'clusterLabel'});t.textContent=c.label;
    gClusters.appendChild(t);
  });

  // determine highlight set (selection/hover)
  const focus=selected||hovered;
  let connected=null;
  if(focus){
    connected=new Set([focus]);
    adj[focus].in.forEach(e=>connected.add(e.from));
    adj[focus].out.forEach(e=>connected.add(e.to));
  }

  // edges
  edges.forEach(e=>{
    const a=nodeById[e.from],b=nodeById[e.to];if(!a||!b)return;
    const showF=visibleByFilter(e.tag);
    const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
    // route right-to-right (back edge) handle
    let d;
    if(x2>=x1){const dx=Math.max(60,(x2-x1)*0.5);d=`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;}
    else{const dx=80;d=`M${x1},${y1} C${x1+dx},${y1-40} ${x2-dx},${y2-40} ${x2},${y2}`;}
    const col={critical:'#ff3860',api:'#ff7a45',db:'#ffb86b',mount:'#4ea1ff',normal:'#5a5a5a'}[e.kind];
    const p=attr(mk('path'),{d,class:'edge',stroke:col,'marker-end':`url(#arr-${e.kind})`});
    if(e.kind==='critical')p.setAttribute('stroke-width','2.3');
    let dim=!showF;
    if(focus){const onPath=(e.from===focus||e.to===focus);if(!onPath)dim=true;}
    if(activeFilter==='roadmap')dim=!(nodeHasBadges(e.from)&&nodeHasBadges(e.to));
    if(dim)p.classList.add('dimmed');
    gEdges.appendChild(p);
    // label
    if(e.label && (showF||(focus&&(e.from===focus||e.to===focus)))){
      const mx=(x1+x2)/2,my=(y1+y2)/2-4;
      const tl=attr(mk('text'),{x:mx,y:my,class:'edgeLabel','text-anchor':'middle'});
      tl.textContent=e.label;if(dim)tl.classList.add('dimmed');
      gEdgeLabels.appendChild(tl);
    }
  });

  // nodes
  nodes.forEach(n=>{
    const g=attr(mk('g'),{class:'node'+(n.critical?' crit':'')});
    const col=COLORS[n.color];
    const rect=attr(mk('rect'),{x:n.x,y:n.y,width:n.w,height:n.h,rx:9,stroke:col});
    const isDead=(n.tag||[]).includes('dead');
    if(isDead)rect.setAttribute('stroke-dasharray','5 4');
    g.appendChild(rect);
    const lab=attr(mk('text'),{x:n.x+13,y:n.y+23,class:'nlabel'});lab.textContent=n.label;g.appendChild(lab);
    const sub=attr(mk('text'),{x:n.x+13,y:n.y+41,class:'nsub'});
    sub.textContent=n.sub;if(isDead)sub.setAttribute('fill','#ff6b6b');g.appendChild(sub);

    // badges
    const fixes=FIXES[n.id]||[],bugs=KNOWN_BUGS[n.id]||[];
    let bx=n.x+n.w-14;
    if(bugs.length){badge(g,bx,n.y+13,bugs.length,'bug');bx-=22;}
    if(fixes.length){badge(g,bx,n.y+13,fixes.length,'fix');}

    // dim logic
    let dim=!visibleByFilter(n.tag);
    if(focus){dim=!connected.has(n.id);}
    if(activeFilter==='roadmap')dim=!nodeHasBadges(n.id);
    if(dim)g.classList.add('dimmed');

    g.onclick=(ev)=>{ev.stopPropagation();selected=(selected===n.id?null:n.id);renderSide(selected);draw();};
    g.onmouseenter=()=>{if(!selected){hovered=n.id;renderSide(n.id);draw();}};
    g.onmouseleave=()=>{if(!selected){hovered=null;renderSide(null);draw();}};
    gNodes.appendChild(g);
  });
}

function badge(g,cx,cy,num,type){
  const c=attr(mk('circle'),{cx,cy,r:9,class:type==='bug'?'badge-bug':'badge-fix'});g.appendChild(c);
  const t=attr(mk('text'),{x:cx,y:cy+3.2,class:'badge-txt','text-anchor':'middle'});t.textContent=num;g.appendChild(t);
}

/* ---------- sidebar ---------- */
const side=document.getElementById('side');
function renderSide(id){
  if(!id){side.innerHTML=defaultSide();return;}
  const n=nodeById[id];if(!n)return;
  const fixes=FIXES[id]||[],bugs=KNOWN_BUGS[id]||[];
  const ins=adj[id].in, outs=adj[id].out;
  let h='';
  h+=`<h2>${esc(n.label)}</h2>`;
  h+=`<div class="path">${esc(n.path||'')}</div>`;
  h+=`<span class="kind" style="border-color:${COLORS[n.color]};color:${COLORS[n.color]}">${clusterName(n.cluster)}${n.critical?' · critical path':''}</span>`;
  h+=`<p class="role">${esc(n.role||'')}</p>`;
  if(n.plain)h+=`<p class="plain">${esc(n.plain)}</p>`;
  if(n.notes&&n.notes.length){h+=`<div class="sec">Notes</div><ul>`+n.notes.map(x=>`<li>${esc(x)}</li>`).join('')+`</ul>`;}
  if(bugs.length){h+=`<div class="sec">Known bugs</div>`+bugs.map(b=>`<div class="bug"><span class="sev">${b.sev}</span>${esc(b.t)}<span class="ref">${esc(b.ref)}</span></div>`).join('');}
  if(fixes.length){h+=`<div class="sec">Roadmap fixes</div>`+fixes.map(f=>`<div class="fix"><b>[${f.n}]</b> ${esc(f.t)}</div>`).join('');}
  if(ins.length){h+=`<div class="sec">Incoming (${ins.length})</div>`+ins.map(e=>`<div class="edgerow"><b>${esc(nodeById[e.from].label)}</b> <span class="arrow">→</span> ${esc(e.label||'')}</div>`).join('');}
  if(outs.length){h+=`<div class="sec">Outgoing (${outs.length})</div>`+outs.map(e=>`<div class="edgerow"><span class="arrow">→</span> <b>${esc(nodeById[e.to].label)}</b> · ${esc(e.label||'')}</div>`).join('');}
  side.innerHTML=h;
}
function clusterName(cid){return (clusters.find(c=>c.id===cid)||{}).label||cid;}

function defaultSide(){
  return `
  <h2>OpenMemo</h2>
  <div class="path">Local AI Knowledge OS · FastAPI + React + Ollama</div>
  <p class="role">${nodes.length} nodes · ${edges.length} edges. Hover or click a box for detail. Click empty canvas to deselect.</p>
  <p class="plain">Save articles, notes, files and videos, then chat with them. Everything runs on your own machine — a local AI engine (Ollama) does the embedding and the answering; nothing leaves your computer except optional metadata fetches.</p>

  <div class="sec">Critical path — the spine</div>
  <ul>
    <li><b>AskMemoPanel</b> → api.ts → <b>/api/chat/stream</b> → <b>rag.py</b> → embedder → Ollama (embed) + ChromaDB (search) → Ollama (chat stream) → SSE back to the panel.</li>
    <li>First SSE event is the source list, then one event per generated token.</li>
  </ul>

  <div class="sec">Notable findings from this map</div>
  <div class="find"><b>FTS5 full-text search is broken.</b> <code>fts5.py:69</code> calls <code>escape_fts5_query</code> but only imports nothing — the name is undefined. Every search throws, is swallowed, and silently degrades to a LIKE substring scan. The "hybrid" search is keyword-half-down.</div>
  <div class="find"><b>MemoService is dead code.</b> CLAUDE.md states "all DB writes go through services/memo_service.py" — but nothing instantiates it. Both ingest.py and memos.py write <code>Memo()</code> rows inline. Doc vs reality mismatch.</div>
  <div class="find"><b>validate_url is imported but never called</b> (<code>ingest.py:16</code>). User URLs are fetched server-side with no scheme/host check — a latent SSRF surface.</div>
  <div class="find"><b>Config knob with no effect.</b> <code>RAG_TOP_K=8</code> is imported in embedder.py but the retrieval count is hardcoded to 8 — tuning the setting changes nothing.</div>
  <div class="find"><b>Three Ollama models, one host.</b> nomic-embed-text (embeddings), qwen2.5:7b (chat) and gemma3:4b (vision) all flow through one multi-host client with a 30s live-host cache.</div>

  <div class="sec">Edge legend</div>
  <div class="legend">
    <span><i class="swatch" style="background:#ff3860"></i>critical path</span>
    <span><i class="swatch" style="background:#ff7a45"></i>external API</span>
    <span><i class="swatch" style="background:#ffb86b"></i>DB read/write</span>
    <span><i class="swatch" style="background:#4ea1ff"></i>mount/route</span>
    <span><i class="swatch" style="background:#5a5a5a"></i>normal call</span>
  </div>
  <div class="sec" style="margin-top:14px">Node badges</div>
  <div class="legend">
    <span><i class="swatch" style="background:#2ecc71;border-radius:50%"></i>roadmap fixes touching this node</span>
    <span><i class="swatch" style="background:#ff3860;border-radius:50%"></i>known bugs (cited file:line)</span>
  </div>
  <p class="hint">Dashed boxes = dead / unreachable code. Use the <b>Roadmap &amp; bugs</b> chip to isolate every node carrying a badge.</p>`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---------- pan + zoom ---------- */
let tx=0,ty=0,scale=1;
const stage=document.getElementById('stage');
function applyT(){root.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}
function fit(){
  const r=stage.getBoundingClientRect();
  const pad=40;
  const s=Math.min((r.width-pad*2)/VBW,(r.height-pad*2)/VBH);
  scale=s; tx=(r.width-VBW*s)/2; ty=(r.height-VBH*s)/2+10; applyT();
}
svg.setAttribute('viewBox',`0 0 ${VBW} ${VBH}`);
svg.setAttribute('preserveAspectRatio','xMidYMid meet');
// we drive transform manually, so set viewBox to pixel space instead:
function setupViewport(){
  const r=stage.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
  fit();
}
window.addEventListener('resize',setupViewport);

let dragging=false,lx=0,ly=0;
stage.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;dragging=true;lx=e.clientX;ly=e.clientY;stage.classList.add('grabbing');});
window.addEventListener('mousemove',e=>{if(!dragging)return;tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;applyT();});
window.addEventListener('mouseup',()=>{dragging=false;stage.classList.remove('grabbing');});
stage.addEventListener('click',e=>{if(!e.target.closest('.node')){selected=null;hovered=null;renderSide(null);draw();}});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const f=e.deltaY<0?1.12:1/1.12;
  const ns=Math.max(0.25,Math.min(3,scale*f));
  tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns; applyT();
},{passive:false});

document.getElementById('zfit').onclick=fit;
document.getElementById('zin').onclick=()=>{scale=Math.min(3,scale*1.2);applyT();};
document.getElementById('zout').onclick=()=>{scale=Math.max(0.25,scale/1.2);applyT();};

// init
draw();
renderSide(null);
setupViewport();
</script>
</body>
</html>
